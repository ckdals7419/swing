# Telegram on-demand:
#   Send /신호 or /signal to the bot → this job picks it up (usually within ~5 min)
# Also runnable manually from Actions → Run workflow
name: KCM Signal Now

on:
  schedule:
    # Poll Telegram for /신호 requests
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q yfinance pandas numpy requests
      - name: Handle request
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python notify_kcm_telegram.py
          else
            python telegram_poll_and_notify.py
          fi
