# Runs after US market close (weekdays).
# Approx: 21:30 UTC = 06:30 KST next day (EDT); still after close in EST too.
name: KCM Daily Telegram

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q yfinance pandas numpy requests
      - name: Send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_kcm_telegram.py
